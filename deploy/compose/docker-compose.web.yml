# Despliegue "dev" (local) del cliente web de CircleGuard.
# Lo ejecuta Jenkins en la rama main después del Quality Gate y las pruebas E2E:
#   WEB_VERSION=1.0.42 docker compose -p circleguard-dev -f deploy/compose/docker-compose.web.yml up -d --wait
# La versión es siempre explícita (nunca "latest"): permite volver a una anterior (rollback).
name: circleguard-dev

services:
  web:
    image: circleguard/web:${WEB_VERSION:?Define WEB_VERSION con la versión a desplegar}
    container_name: circleguard-web
    restart: unless-stopped
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    labels:
      com.circleguard.environment: "dev"
      com.circleguard.version: "${WEB_VERSION}"
