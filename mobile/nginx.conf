#Este es un mensaje de prueba!

# Cliente web de CircleGuard (salida estática de `expo export -p web`)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Expo Router genera una página .html por ruta (/login -> login.html)
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Recursos con hash en el nombre
    location /_expo/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Healthcheck del contenedor y del smoke test
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
