# Plataforma de CI de CircleGuard (Sprint 1): Jenkins + SonarQube (+ su PostgreSQL)
# Se levanta con:  bash infra/bootstrap/bootstrap-ci.sh
# Variables: infra/.env (no versionado, ver infra/.env.example)
name: circleguard-ci

services:
  jenkins:
    build: ./jenkins
    image: circleguard/jenkins:1.0.0
    container_name: cg-jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    environment:
      # JCasC lee cada ${CLAVE} de un archivo /run/secrets/CLAVE: así los secretos no
      # quedan como variables de entorno visibles para los builds.
      SECRETS: /run/secrets
      # Testcontainers corre dentro de Jenkins pero lanza contenedores "hermanos"
      # en el Docker del host: debe conectarse a ellos por el gateway del host.
      TESTCONTAINERS_HOST_OVERRIDE: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.secrets:/run/secrets:ro
    depends_on:
      - sonarqube
    networks: [ci]

  sonarqube:
    image: sonarqube:10.7.0-community
    container_name: cg-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    # Sin healthcheck: el bootstrap espera a /api/system/status = UP desde el host.
    depends_on:
      sonar-db:
        condition: service_healthy
    networks: [ci]

  sonar-db:
    image: postgres:16
    container_name: cg-sonar-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD}
      POSTGRES_DB: sonar
    volumes:
      - sonar_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonar"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [ci]

volumes:
  jenkins_home:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonar_db:

networks:
  ci:
    name: circleguard-ci
