# Jenkins Configuration as Code (JCasC)
# Los valores ${...} se leen de archivos en /run/secrets (montado desde infra/.secrets,
# generado por infra/bootstrap/bootstrap-ci.sh).
jenkins:
  systemMessage: "CircleGuard CI - Ingeniería de Software V (Icesi)"
  numExecutors: 2
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "${JENKINS_ADMIN_USER}"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

credentials:
  system:
    domainCredentials:
      - credentials:
          - string:
              scope: GLOBAL
              id: "sonarqube-token"
              description: "Token de análisis de SonarQube"
              secret: "${SONAR_TOKEN}"
          - usernamePassword:
              scope: GLOBAL
              id: "github-credentials"
              description: "GitHub PAT (repo, admin:repo_hook)"
              username: "${GITHUB_USER}"
              password: "${GITHUB_TOKEN}"

unclassified:
  location:
    url: "${JENKINS_LOCATION_URL}"
  sonarGlobalConfiguration:
    buildWrapperEnabled: true
    installations:
      - name: "SonarQube-Server"
        serverUrl: "http://sonarqube:9000"
        credentialsId: "sonarqube-token"
